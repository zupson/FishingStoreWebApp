<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Nova narudžba</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Nova narudžba</h4>
        <a th:href="@{/mvc/orders}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width: 480px;">
        <div class="card-body">
            <p class="text-muted small mb-3">Narudžba se kreira za trenutno prijavljenog korisnika iz aktivne košarice.</p>
            <form th:action="@{/mvc/orders/create}" th:object="${orders}" method="post">
                <div class="mb-4">
                    <label class="form-label fw-semibold">Adresa dostave <span class="text-danger">*</span></label>
                    <input type="number" min="1" class="form-control" th:field="*{addressId}"
                           th:classappend="${#fields.hasErrors('addressId')} ? 'is-invalid'"
                           placeholder="ID adrese dostave"/>
                    <div class="invalid-feedback" th:errors="*{addressId}"></div>
                    <div class="form-text"><a th:href="@{/mvc/addresses}">Pogledaj moje adrese</a></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Naruči</button>
                    <a th:href="@{/mvc/orders}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
