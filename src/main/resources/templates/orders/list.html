<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Narudžbe</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Narudžbe</h4>
    </div>

    <div sec:authorize="hasRole('ADMIN')" class="card shadow-sm mb-3">
        <div class="card-body">
            <form th:action="@{/mvc/orders/search}" method="get" class="row g-2 align-items-end">
                <div class="col-md-4">
                    <label class="form-label small text-muted" for="username">Korisničko ime</label>
                    <input type="text" id="username" name="username" class="form-control form-control-sm"
                           placeholder="Pretraži po korisniku" th:value="${param.username}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted" for="from">Od datuma</label>
                    <input type="date" id="from" name="from" class="form-control form-control-sm"
                           th:value="${param.from}"/>
                </div>
                <div class="col-md-3">
                    <label class="form-label small text-muted" for="to">Do datuma</label>
                    <input type="date" id="to" name="to" class="form-control form-control-sm"
                           th:value="${param.to}"/>
                </div>
                <div class="col-md-2 d-flex gap-1">
                    <button type="submit" class="btn btn-primary btn-sm w-100">
                        <i class="bi bi-search me-1"></i>Traži
                    </button>
                    <a th:href="@{/mvc/orders}" class="btn btn-outline-secondary btn-sm">
                        <i class="bi bi-x"></i>
                    </a>
                </div>
            </form>
        </div>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Datum</th>
                    <th>Ukupno</th>
                    <th>Status</th>
                    <th sec:authorize="hasRole('ADMIN')">Korisničko ime</th>
                    <th sec:authorize="hasRole('ADMIN')">Email</th>

                    <th class="text-end">Akcije</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="o : ${orders}" th:object="${o}">
                    <td class="text-muted small" th:text="*{#temporals.format(createdAt,'dd.MM.yyyy HH:mm')}"></td>

                    <td class="fw-semibold" th:text="'€ ' + *{totalPrice}"></td>

                    <td>
                            <span class="badge"
                                  th:classappend="*{orderStatus.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                                  (*{orderStatus.name() == 'CONFIRMED'} ? 'bg-info text-dark' :
                                                  (*{orderStatus.name() == 'DELIVERED'} ? 'bg-success' :
                                                  (*{orderStatus.name() == 'CANCELLED'} ? 'bg-danger' : 'bg-secondary')))"
                                  th:text="*{orderStatus}"></span>
                    </td>

                    <td sec:authorize="hasRole('ADMIN')" th:text="*{user.username}"></td>
                    <td sec:authorize="hasRole('ADMIN')" th:text="*{user.email}"></td>

                    <td class="text-end">
                        <a th:href="@{/mvc/orders/{id}(id=*{id})}" class="btn btn-sm btn-outline-secondary me-1">
                            <i class="bi bi-eye"></i>
                        </a>
                        <a sec:authorize="hasRole('ADMIN')"
                           th:href="@{/mvc/orders/edit/{id}(id=*{id})}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil"></i>
                        </a>

                        <form sec:authorize="hasRole('ADMIN')"
                              th:action="@{/mvc/orders/delete/{id}(id=*{id})}" method="post" class="d-inline"
                              onsubmit="return confirm('Obrisati narudžbu?')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>

                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="6" class="text-center text-muted py-5">
                        <i class="bi bi-receipt fs-1 d-block mb-2"></i>Nema narudžbi.
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
