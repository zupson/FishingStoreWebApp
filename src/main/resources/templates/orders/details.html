<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Detalji narudžbe</title></head>
<body>
<div layout:fragment="content" th:object="${orders}">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Detalji narudžbe</span></h4>
        <a th:href="${backUrl != null ? backUrl : '/mvc/orders'}"
           class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Nazad
        </a>
    </div>

    <div class="row g-3" style="max-width: 900px;">
        <div class="col-md-5">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-semibold bg-transparent">Informacije narudžbe</div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-muted">Ukupna cijena</dt>
                        <dd class="col-sm-7 fw-bold text-success" th:text="'€ ' + *{totalPrice}"></dd>
                        <dt class="col-sm-5 text-muted">Status</dt>
                        <dd class="col-sm-7">
                            <span class="badge"
                                  th:classappend="*{orderStatus.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                                  (*{orderStatus.name() == 'CONFIRMED'} ? 'bg-info text-dark' :
                                                  (*{orderStatus.name() == 'DELIVERED'} ? 'bg-success' : 'bg-secondary'))"
                                  th:text="*{orderStatus}"></span>
                        </dd>
                        <dt class="col-sm-5 text-muted">Datum</dt>
                        <dd class="col-sm-7 small" th:text="*{#temporals.format(createdAt,'dd.MM.yyyy HH:mm')}"></dd>
                        <dt class="col-sm-5 text-muted">Adresa</dt>

                        <dd class="col-sm-7 small">
                            <span th:text="*{address.street}"></span>,
                            <span th:text="*{address.postalCode}"></span>
                            <span th:text="*{address.city}"></span>,
                            <span th:text="*{address.country}"></span>
                        </dd>
                        <dt sec:authorize="hasRole('ADMIN')" class="col-sm-5 text-muted">Korisnik</dt>
                        <dd sec:authorize="hasRole('ADMIN')" class="col-sm-7 small" th:text="*{user.email}"></dd>
                    </dl>
                </div>
            </div>
        </div>
        <div class="col-md-7">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-semibold bg-transparent">Naručeni proizvodi</div>
                <div class="card-body p-0">
                    <table class="table table-sm mb-0 align-middle">
                        <thead class="table-light">
                        <tr>
                            <th>Slika</th>
                            <th>Naziv</th>
                            <th>Količina</th>
                            <th>Cijena</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="po : ${productOrders}">
                            <td>
                                <img th:src="'https://res.cloudinary.com/dmexg6psx/image/upload/' + ${po.product.imagePath}"
                                     style="height: 50px; width: 50px; object-fit: contain;"
                                     alt="Slika proizvoda"/>
                            </td>
                            <td th:text="${po.product.name}" class="small fw-semibold"></td>
                            <td th:text="${po.quantity}"></td>
                            <td th:text="'€ ' + ${po.priceAtPurchase}" class="text-success fw-bold"></td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(productOrders)}">
                            <td colspan="4" class="text-center text-muted small">Nema proizvoda</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/mvc/orders/edit/{id}(id=*{id})}" class="btn btn-primary btn-sm">
            Promijeni status
        </a>
        <form sec:authorize="hasRole('ADMIN')"
              th:action="@{/mvc/orders/delete/{id}(id=*{id})}" method="post"
              onsubmit="return confirm('Obrisati narudžbu?')">
            <button class="btn btn-outline-danger btn-sm">Obriši</button>
        </form>
    </div>
</div>
</body>
</html>
