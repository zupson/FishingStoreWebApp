<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Detalji narudžbe</title></head>
<body>
<div layout:fragment="content" th:object="${orders}">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-receipt me-2 text-primary"></i>Narudžba #<span th:text="*{id}"></span></h4>
        <a th:href="@{/mvc/orders}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>

    <div class="row g-3" style="max-width: 800px;">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-semibold bg-transparent">Informacije narudžbe</div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-muted">Ukupna cijena</dt>
                        <dd class="col-sm-7 fw-bold text-success" th:text="'€ ' + *{totalPrice}"></dd>
                        <dt class="col-sm-5 text-muted">Status</dt>
                        <dd class="col-sm-7">
                            <span class="badge"
                                  th:classappend="*{orderStatus.name() == 'PENDING'} ? 'bg-warning text-dark' :
                                                  (*{orderStatus.name() == 'CONFIRMED'} ? 'bg-info text-dark' :
                                                  (*{orderStatus.name() == 'DELIVERED'} ? 'bg-success' : 'bg-secondary'))"
                                  th:text="*{orderStatus}"></span>
                        </dd>
                        <dt class="col-sm-5 text-muted">Datum</dt>
                        <dd class="col-sm-7 small" th:text="*{#temporals.format(createdAt,'dd.MM.yyyy HH:mm')}"></dd>
                        <dt class="col-sm-5 text-muted">Adresa</dt>
                        <dd class="col-sm-7">
                            <a th:href="@{/mvc/addresses/{id}(id=*{addressId})}" th:text="'Adresa #' + *{addressId}" class="text-decoration-none small"></a>
                        </dd>
                        <!-- Admin vidi i korisnika -->
                        <dt sec:authorize="hasRole('ADMIN')" class="col-sm-5 text-muted">Korisnik</dt>
                        <dd sec:authorize="hasRole('ADMIN')" class="col-sm-7">
                            <a th:href="@{/mvc/users/{id}(id=*{userId})}" th:text="'Korisnik #' + *{userId}" class="text-decoration-none small"></a>
                        </dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <!-- Samo admin mijenja status i briše -->
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/mvc/orders/edit/{id}(id=*{id})}" class="btn btn-primary btn-sm">
            <i class="bi bi-arrow-repeat me-1"></i>Promijeni status
        </a>
        <form sec:authorize="hasRole('ADMIN')"
              th:action="@{/mvc/orders/delete/{id}(id=*{id})}" method="post"
              onsubmit="return confirm('Obrisati narudžbu?')">
            <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash me-1"></i>Obriši</button>
        </form>
    </div>
</div>
</body>
</html>
