<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head>
    <meta charset="UTF-8"/>
    <title>Registracija</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center mt-5">
        <div class="col-md-6 col-lg-5">
            <div class="card shadow border-0">
                <div class="card-body p-4">

                    <div class="text-center mb-4">
                        <h4 class="fw-bold mt-2">Kreirajte račun</h4>
                    </div>

                    <form th:action="@{/mvc/auth/register}" th:object="${registerDto}" method="post">

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Ime</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-person text-muted"></i>
                                    </span>
                                    <input type="text"
                                           th:field="*{firstName}"
                                           class="form-control border-start-0"
                                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"
                                           placeholder="Ime"/>
                                    <div class="invalid-feedback" th:errors="*{firstName}"></div>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold">Prezime</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-person text-muted"></i>
                                    </span>
                                    <input type="text"
                                           th:field="*{lastName}"
                                           class="form-control border-start-0"
                                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"
                                           placeholder="Prezime"/>
                                    <div class="invalid-feedback" th:errors="*{lastName}"></div>
                                </div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Email</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-envelope text-muted"></i>
                                </span>
                                <input type="email"
                                       th:field="*{email}"
                                       class="form-control border-start-0"
                                       th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"
                                       placeholder="email@primjer.com"/>
                                <div class="invalid-feedback" th:errors="*{email}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Korisničko ime</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-at text-muted"></i>
                                </span>
                                <input type="text"
                                       th:field="*{username}"
                                       class="form-control border-start-0"
                                       th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"
                                       placeholder="Korisničko ime"/>
                                <div class="invalid-feedback" th:errors="*{username}"></div>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-semibold">Lozinka</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0">
                                    <i class="bi bi-lock text-muted"></i>
                                </span>
                                <input type="password"
                                       th:field="*{password}"
                                       class="form-control border-start-0"
                                       th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'"
                                       placeholder="Lozinka"/>
                                <div class="invalid-feedback" th:errors="*{password}"></div>
                            </div>
                        </div>


                        <button type="submit" class="btn btn-dark w-100 py-2 fw-semibold">
                            Kreiraj račun
                        </button>
                    </form>

                    <hr class="my-3"/>

                    <p class="text-center text-muted small mb-0">
                        Već imate račun?
                        <a th:href="@{/mvc/auth/login}" class="text-dark fw-semibold text-decoration-none">
                            Prijavite se
                        </a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
