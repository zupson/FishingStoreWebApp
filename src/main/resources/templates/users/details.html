<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Detalji korisnika</title></head>
<body>
<div layout:fragment="content" th:object="${users}">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-person me-2 text-primary"></i>Detalji korisnika</h4>
        <a th:href="@{/mvc/users}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width:580px;">
        <div class="card-body">
            <div class="d-flex align-items-center gap-3 mb-4">
                <div class="rounded-circle bg-primary text-white d-flex align-items-center justify-content-center" style="width:56px;height:56px;font-size:1.4rem;" th:text="*{firstName.charAt(0)} + *{lastName.charAt(0)}"></div>
                <div>
                    <h5 class="mb-0" th:text="*{firstName + ' ' + lastName}"></h5>
                    <small class="text-muted" th:text="'@' + *{username}"></small>
                </div>
                <span class="badge ms-auto" th:classappend="*{role.name() == 'ADMIN'} ? 'bg-danger' : 'bg-secondary'" th:text="*{role}"></span>
            </div>
            <dl class="row mb-0">
                <dt class="col-sm-4 text-muted">Email</dt><dd class="col-sm-8" th:text="*{email}"></dd>
                <dt class="col-sm-4 text-muted">Aktivan</dt>
                <dd class="col-sm-8">
                    <span th:if="*{enabled}" class="badge bg-success">Aktivan</span>
                    <span th:unless="*{enabled}" class="badge bg-secondary">Neaktivan</span>
                </dd>
                <dt class="col-sm-4 text-muted">Registriran</dt><dd class="col-sm-8 small" th:text="*{#temporals.format(createdAt,'dd.MM.yyyy HH:mm')}"></dd>
            </dl>
        </div>
        <div class="card-footer d-flex gap-2">
            <a th:href="@{/mvc/users/edit/{id}(id=*{id})}" class="btn btn-primary btn-sm"><i class="bi bi-pencil me-1"></i>Uredi</a>
            <form th:action="@{/mvc/users/delete/{id}(id=*{id})}" method="post" class="ms-auto" onsubmit="return confirm('Obrisati korisnika?')">
                <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash me-1"></i>Obriši</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
