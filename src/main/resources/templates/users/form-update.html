<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Uredi korisnika</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-pencil me-2 text-primary"></i>Uredi korisnika</h4>
        <a th:href="@{/mvc/users}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width:560px;">
        <div class="card-body">
            <form th:action="@{/mvc/users/edit/{id}(id=${userId})}" th:object="${users}" method="post">
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Ime <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{firstName}" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{firstName}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Prezime <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{lastName}" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{lastName}"></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" th:field="*{email}" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Korisničko ime <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{username}" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{username}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Spremi</button>
                    <a th:href="@{/mvc/users}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
