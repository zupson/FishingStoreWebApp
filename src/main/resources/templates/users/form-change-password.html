<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Promjena lozinke</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-key me-2 text-primary"></i>Promjena lozinke</h4>
        <a th:href="@{/mvc/users}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width:440px;">
        <div class="card-body">
            <form th:action="@{/mvc/users/change-password}" th:object="${changePassword}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Stara lozinka <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" th:field="*{oldPassword}" th:classappend="${#fields.hasErrors('oldPassword')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{oldPassword}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Nova lozinka <span class="text-danger">*</span></label>
                    <input type="password" class="form-control" th:field="*{newPassword}" th:classappend="${#fields.hasErrors('newPassword')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{newPassword}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Promijeni</button>
                    <a th:href="@{/mvc/users}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
