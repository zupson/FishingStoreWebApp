<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Greška</title></head>
<body>
<div layout:fragment="content">
    <div class="text-center py-5">
        <i class="bi bi-exclamation-triangle fs-1 text-danger d-block mb-3"></i>
        <h4 class="mb-2">Došlo je do greške</h4>
        <p class="text-muted" th:text="${error}">Pokušajte ponovo kasnije.</p>
        <a th:href="@{/mvc/categories}" class="btn btn-outline-secondary btn-sm mt-2">
            <i class="bi bi-arrow-left me-1"></i>Povratak na početnu
        </a>
    </div>
</div>
</body>
</html>
