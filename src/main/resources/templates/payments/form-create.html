<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Novo plaćanje</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-plus-circle me-2 text-primary"></i>Novo plaćanje</h4>
        <a th:href="@{/mvc/payments}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width: 520px;">
        <div class="card-body">
            <form th:action="@{/mvc/payments/create}" th:object="${payments}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Narudžba ID <span class="text-danger">*</span></label>
                    <input type="number" min="1" class="form-control" th:field="*{orderId}"
                           th:classappend="${#fields.hasErrors('orderId')} ? 'is-invalid'" placeholder="ID narudžbe"/>
                    <div class="invalid-feedback" th:errors="*{orderId}"></div>
                    <div class="form-text"><a th:href="@{/mvc/orders}">Pogledaj moje narudžbe</a></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Valuta <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{currency}" th:classappend="${#fields.hasErrors('currency')} ? 'is-invalid'">
                            <option value="">-- Odaberi --</option>
                            <option value="EUR">EUR</option>
                            <option value="USD">USD</option>
                            <option value="HRK">HRK</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{currency}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Metoda plaćanja <span class="text-danger">*</span></label>
                        <select class="form-select" th:field="*{paymentMethod}" th:classappend="${#fields.hasErrors('paymentMethod')} ? 'is-invalid'">
                            <option value="">-- Odaberi --</option>
                            <option value="CREDIT_CARD">Kreditna kartica</option>
                            <option value="PAYPAL">PayPal</option>
                            <option value="BANK_TRANSFER">Bankovni transfer</option>
                            <option value="CASH">Gotovina</option>
                        </select>
                        <div class="invalid-feedback" th:errors="*{paymentMethod}"></div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">PayPal Transaction ID <span class="text-muted">(opcionalno)</span></label>
                    <input type="text" class="form-control" th:field="*{paypalTransactionId}" placeholder="npr. TXN-12345"/>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Plati</button>
                    <a th:href="@{/mvc/payments}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
