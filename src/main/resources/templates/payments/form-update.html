<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Ažuriranje plaćanja</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-pencil me-2 text-primary"></i>Ažuriranje statusa plaćanja</h4>
        <a th:href="@{/mvc/payments}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width: 440px;">
        <div class="card-body">
            <form th:action="@{/mvc/payments/edit/{id}(id=${orderId})}" th:object="${payments}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Status plaćanja <span class="text-danger">*</span></label>
                    <select class="form-select" th:field="*{paymentStatus}" th:classappend="${#fields.hasErrors('paymentStatus')} ? 'is-invalid'">
                        <option value="">-- Odaberi --</option>
                        <option value="PENDING">PENDING</option>
                        <option value="PAID">PAID</option>
                        <option value="FAILED">FAILED</option>
                        <option value="REFUNDED">REFUNDED</option>
                    </select>
                    <div class="invalid-feedback" th:errors="*{paymentStatus}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">PayPal Transaction ID</label>
                    <input type="text" class="form-control" th:field="*{paypalTransactionId}"/>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Spremi</button>
                    <a th:href="@{/mvc/payments}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
