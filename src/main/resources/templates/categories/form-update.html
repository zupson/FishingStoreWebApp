<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Uredi kategoriju</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Uredi kategoriju</h4>
        <a th:href="@{/mvc/categories}" class="btn btn-outline-secondary btn-sm">Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width: 560px;">
        <div class="card-body">
            <form th:action="@{/mvc/categories/edit/{id}(id=${categoryId})}" th:object="${categories}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Naziv <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{name}" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Spremi izmjene</button>
                    <a th:href="@{/mvc/categories}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
