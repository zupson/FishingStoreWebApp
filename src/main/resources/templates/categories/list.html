<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Kategorije</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-tags me-2 text-primary"></i>Kategorije</h4>
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/mvc/categories/new}" class="btn btn-primary btn-sm">
            <i class="bi bi-plus-lg me-1"></i>Nova kategorija
        </a>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        <div class="col" th:each="cat : ${categories}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title fw-bold" th:text="${cat.name}"></h6>
                    <p class="card-text text-muted small" th:text="${cat.description}"></p>
                </div>
                <div class="card-footer d-flex justify-content-between align-items-center bg-transparent">
                    <a th:href="@{/mvc/products(categoryId=${cat.id})}"
                       class="btn btn-sm btn-outline-primary">
                        <i class="bi bi-bag me-1"></i>Proizvodi
                    </a>
                    <!-- Samo admin vidi uredi/obriši -->
                    <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-1">
                        <a th:href="@{/mvc/categories/edit/{id}(id=${cat.id})}"
                           class="btn btn-sm btn-outline-secondary" title="Uredi">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/mvc/categories/delete/{id}(id=${cat.id})}" method="post"
                              onsubmit="return confirm('Obrisati kategoriju?')">
                            <button class="btn btn-sm btn-outline-danger" title="Obriši">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(categories)}">
            <i class="bi bi-tags fs-1 d-block mb-2"></i>Nema kategorija.
        </div>
    </div>
</div>
</body>
</html>
