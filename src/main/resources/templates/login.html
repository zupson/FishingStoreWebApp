<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Prijava</title></head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-sm-8 col-md-5 col-lg-4">
            <div class="card shadow-sm mt-5">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4 fw-bold">
                        <i class="bi bi-fish text-primary me-2"></i>Fishing Store
                    </h4>

                    <div th:if="${param.error}" class="alert alert-danger py-2 small">
                        <i class="bi bi-exclamation-triangle me-1"></i>Pogrešno korisničko ime ili lozinka.
                    </div>
                    <div th:if="${param.logout}" class="alert alert-success py-2 small">
                        <i class="bi bi-check-circle me-1"></i>Uspješno ste se odjavili.
                    </div>

                    <form th:action="@{/mvc/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label fw-semibold">Korisničko ime</label>
                            <input type="text" name="username" class="form-control" placeholder="username" autofocus/>
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold">Lozinka</label>
                            <input type="password" name="password" class="form-control" placeholder="••••••••"/>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Prijavi se
                        </button>
                    </form>
                </div>
            </div>
            <p class="text-center text-muted small mt-3">
                Nemaš račun? Registriraj se putem API-ja.
            </p>
        </div>
    </div>
</div>
</body>
</html>
