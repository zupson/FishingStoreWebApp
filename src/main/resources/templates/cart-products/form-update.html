<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Uredi količinu</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-pencil me-2 text-primary"></i>Uredi količinu</h4>
        <a th:href="@{/mvc/cart-products}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Košarica</a>
    </div>
    <div class="card shadow-sm" style="max-width:400px;">
        <div class="card-body">
            <form th:action="@{/mvc/cart-products/edit/{id}(id=${cartProductId})}" th:object="${cartProducts}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Košarica ID <span class="text-danger">*</span></label>
                    <input type="number" min="1" class="form-control" th:field="*{cartId}" th:classappend="${#fields.hasErrors('cartId')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{cartId}"></div>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Proizvod ID <span class="text-danger">*</span></label>
                    <input type="number" min="1" class="form-control" th:field="*{productId}" th:classappend="${#fields.hasErrors('productId')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{productId}"></div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Količina <span class="text-danger">*</span></label>
                    <input type="number" min="1" class="form-control" th:field="*{quantity}" th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Spremi</button>
                    <a th:href="@{/mvc/cart-products}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
