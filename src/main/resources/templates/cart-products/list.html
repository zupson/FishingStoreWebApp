<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Košarica</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-cart me-2 text-primary"></i>Moja košarica</h4>
        <a th:href="@{/mvc/products}" class="btn btn-outline-primary btn-sm"><i class="bi bi-bag me-1"></i>Nastavi kupovinu</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Proizvod</th><th>Količina</th><th class="text-end">Akcije</th></tr></thead>
                <tbody>
                    <tr th:each="cp : ${cartProducts}" th:object="${cp}">
                        <td><a th:href="@{/mvc/products/{id}(id=*{productId})}" th:text="'Proizvod #' + *{productId}" class="text-decoration-none fw-semibold"></a></td>
                        <td><span class="badge bg-primary rounded-pill fs-6" th:text="*{quantity}"></span></td>
                        <td class="text-end">
                            <a th:href="@{/mvc/cart-products/edit/{id}(id=*{id})}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/mvc/cart-products/delete/{id}(id=*{id})}" method="post" class="d-inline" onsubmit="return confirm('Ukloniti iz košarice?')">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(cartProducts)}">
                        <td colspan="3" class="text-center text-muted py-5">
                            <i class="bi bi-cart-x fs-1 d-block mb-2"></i>Košarica je prazna.
                            <a th:href="@{/mvc/products}" class="btn btn-primary btn-sm mt-2">Idi na proizvode</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer d-flex justify-content-end" th:unless="${#lists.isEmpty(cartProducts)}">
            <!-- Ulogiran može naručiti -->
            <a sec:authorize="isAuthenticated()"
               th:href="@{/mvc/orders/new}" class="btn btn-success">
                <i class="bi bi-bag-check me-1"></i>Nastavi na narudžbu
            </a>
            <!-- Anonimni se mora prijaviti za checkout -->
            <div sec:authorize="isAnonymous()" class="d-flex align-items-center gap-3">
                <span class="text-muted small"><i class="bi bi-lock me-1"></i>Prijava potrebna za narudžbu</span>
                <a th:href="@{/mvc/login}" class="btn btn-primary">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Prijavi se
                </a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
