<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Košarica</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Moja košarica</h4>
        <a th:href="@{/mvc/categories}" class="btn btn-outline-primary btn-sm">Nastavi kupovinu</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>Proizvod</th>
                    <th>Količina</th>
                    <th>Cijena po komadu</th>
                    <th>Ukupno</th>
                    <th></th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${cartItems}">
                    <td>
                        <a th:href="@{/mvc/products/{id}(id=${entry.key.id})}"
                           th:text="${entry.key.name}"
                           class="text-decoration-none fw-semibold"></a>
                    </td>
                    <td>
                        <form th:action="@{/mvc/cart-products/update/{id}(id=${entry.key.id})}" method="post">
                            <input type="number" name="quantity" min="1" th:value="${entry.value}"
                                   aria-label="Količina"
                                   class="form-control form-control-sm" style="width:70px"
                                   onchange="this.form.submit()"/>
                        </form>
                    </td>
                    <td th:text="${entry.key.price} + ' €'"></td>
                    <td th:text="${entry.key.price.multiply(T(java.math.BigDecimal).valueOf(entry.value.longValue()))} + ' €'"></td>
                    <td>
                        <form th:action="@{/mvc/cart-products/delete/{id}(id=${entry.key.id})}"
                              method="post"
                              onsubmit="return confirm('Ukloniti iz košarice?')">
                            <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                        </form>
                    </td>
                </tr>
                <tr th:unless="${#maps.isEmpty(cartItems)}">
                    <td colspan="3" class="text-end fw-bold">Ukupno:</td>
                    <td class="fw-bold" th:text="${total} + ' €'"></td>
                    <td></td>
                </tr>
                <tr th:if="${#maps.isEmpty(cartItems)}">
                    <td colspan="5" class="text-center text-muted py-5">
                        <i class="bi bi-cart-x fs-1 d-block mb-2"></i>Košarica je prazna.

                    </td>
                </tr>
                </tbody>

            </table>
        </div>
    </div>
    <div th:unless="${#maps.isEmpty(cartItems)}" class="d-flex justify-content-end mt-3">
        <a sec:authorize="isAuthenticated()"
           th:href="@{/mvc/orders/new}"
           class="btn btn-success">
            Nastavi na plaćanje
        </a>
        <a sec:authorize="isAnonymous()"
           th:href="@{/mvc/login}"
           class="btn btn-success">
            Prijavi se za nastavak
        </a>
    </div>
</div>

</body>
</html>
