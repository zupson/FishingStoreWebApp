<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Uredi adresu</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-pencil me-2 text-primary"></i>Uredi adresu</h4>
        <a th:href="@{/mvc/addresses}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width:520px;">
        <div class="card-body">
            <form th:action="@{/mvc/addresses/edit/{id}(id=${addressId})}" th:object="${addresses}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Ulica <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{street}" th:classappend="${#fields.hasErrors('street')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{street}"></div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Grad <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" th:field="*{city}" th:classappend="${#fields.hasErrors('city')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{city}"></div>
                    </div>
                    <div class="col-sm-6">
                        <label class="form-label fw-semibold">Poštanski broj <span class="text-danger">*</span></label>
                        <input type="number" class="form-control" th:field="*{postalCode}" th:classappend="${#fields.hasErrors('postalCode')} ? 'is-invalid'"/>
                        <div class="invalid-feedback" th:errors="*{postalCode}"></div>
                    </div>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Država <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{country}" th:classappend="${#fields.hasErrors('country')} ? 'is-invalid'"/>
                    <div class="invalid-feedback" th:errors="*{country}"></div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Spremi izmjene</button>
                    <a th:href="@{/mvc/addresses}" class="btn btn-outline-secondary">Odustani</a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
