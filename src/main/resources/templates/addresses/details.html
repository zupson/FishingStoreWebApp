<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Detalji adrese</title></head>
<body>
<div layout:fragment="content" th:object="${addresses}">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-geo-alt me-2 text-primary"></i>Detalji adrese</h4>
        <a th:href="@{/mvc/addresses}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width:500px;">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4 text-muted">Ulica</dt><dd class="col-sm-8" th:text="*{street}"></dd>
                <dt class="col-sm-4 text-muted">Grad</dt><dd class="col-sm-8" th:text="*{city}"></dd>
                <dt class="col-sm-4 text-muted">Poštanski broj</dt><dd class="col-sm-8" th:text="*{postalCode}"></dd>
                <dt class="col-sm-4 text-muted">Država</dt><dd class="col-sm-8" th:text="*{country}"></dd>
            </dl>
        </div>
        <div class="card-footer d-flex gap-2">
            <a th:href="@{/mvc/addresses/edit/{id}(id=*{id})}" class="btn btn-primary btn-sm"><i class="bi bi-pencil me-1"></i>Uredi</a>
            <form th:action="@{/mvc/addresses/delete/{id}(id=*{id})}" method="post" onsubmit="return confirm('Obrisati adresu?')">
                <button class="btn btn-outline-danger btn-sm"><i class="bi bi-trash me-1"></i>Obriši</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
