<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Adrese</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-geo-alt me-2 text-primary"></i>Adrese</h4>
        <a th:href="@{/mvc/addresses/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Nova adresa</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>#</th><th>Ulica</th><th>Grad</th><th>Poštanski broj</th><th>Država</th><th class="text-end">Akcije</th></tr></thead>
                <tbody>
                    <tr th:each="a : ${addresses}" th:object="${a}">
                        <td th:text="*{id}" class="text-muted small"></td>
                        <td th:text="*{street}"></td><td th:text="*{city}"></td>
                        <td th:text="*{postalCode}"></td><td th:text="*{country}"></td>
                        <td class="text-end">
                            <a th:href="@{/mvc/addresses/{id}(id=*{id})}" class="btn btn-sm btn-outline-secondary me-1"><i class="bi bi-eye"></i></a>
                            <a th:href="@{/mvc/addresses/edit/{id}(id=*{id})}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/mvc/addresses/delete/{id}(id=*{id})}" method="post" class="d-inline" onsubmit="return confirm('Obrisati adresu?')">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(addresses)}"><td colspan="6" class="text-center text-muted py-4">Nema adresa.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
