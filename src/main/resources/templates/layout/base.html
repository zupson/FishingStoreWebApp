<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="hr">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title layout:title-pattern="$CONTENT_TITLE - Fishing Store">Fishing Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/mvc/products}">
            <i class="bi bi-fish me-2"></i>Fishing Store</a>
    </div>

    <div class="container">

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">

                <li class="nav-item">
                    <a class="nav-link" th:href="@{/mvc/categories}">Kategorije</a>
                </li>

                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link" th:href="@{/mvc/orders}"><i class="bi bi-receipt me-1"></i>Narudžbe</a>
                </li>
                <li class="nav-item dropdown" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-shield-lock me-1"></i>Admin
                    </a>
                    <ul class="dropdown-menu">
                        <li><a class="dropdown-item" th:href="@{/mvc/users}"><i class="bi bi-people me-2"></i>Korisnici</a>
                        </li>
                        <li><a class="dropdown-item" th:href="@{/mvc/addresses}"><i class="bi bi-geo-alt me-2"></i>Adrese</a>
                        </li>
                        <li><a class="dropdown-item" th:href="@{/mvc/payments}"><i class="bi bi-credit-card me-2"></i>Plaćanja</a>
                        </li>
                        <li><a class="dropdown-item" th:href="@{/mvc/product-orders}"><i
                                class="bi bi-box-seam me-2"></i>Stavke narudžbi</a></li>
                        <li>
                            <hr class="dropdown-divider"/>
                        </li>
                        <li><a class="dropdown-item" th:href="@{/mvc/login-histories}"><i
                                class="bi bi-clock-history me-2"></i>Login povijest</a></li>
                    </ul>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/templates/cart-products/list}"><i class="bi bi-cart me-1"></i></a>
                </li>
                <!--                <li class="nav-item" sec:authorize="isAnonymous()">-->
                <!--                    <a class="btn btn-outline-light btn-sm" th:href="@{/mvc/login}">-->
                <!--                        <i class="bi bi-box-arrow-in-right me-1"></i>Prijava-->
                <!--                    </a>-->
                <!--                </li>-->
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/mvc/logout}" method="post">
                                <button class="dropdown-item text-danger">
                                    <i class="bi bi-box-arrow-right me-2"></i>Odjava
                                </button>
                            </form>
                        </li>
                    </ul>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4" layout:fragment="content">
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
