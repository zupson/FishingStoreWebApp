<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Detalji prijave</title></head>
<body>
<div layout:fragment="content" th:object="${loginHistories}">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Detalji prijave #<span th:text="*{id}"></span></h4>
        <a th:href="@{/mvc/login-histories}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>
    <div class="card shadow-sm" style="max-width:500px;">
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-4 text-muted">IP adresa</dt><dd class="col-sm-8 font-monospace" th:text="*{ipAddress}"></dd>
                <dt class="col-sm-4 text-muted">Rezultat</dt>
                <dd class="col-sm-8">
                    <span th:if="*{success}" class="badge bg-success fs-6">Uspješno</span>
                    <span th:unless="*{success}" class="badge bg-danger fs-6">Neuspješno</span>
                </dd>
                <dt class="col-sm-4 text-muted">Korisnik</dt>
                <dd class="col-sm-8"><a th:href="@{/mvc/users/{id}(id=*{userId})}" th:text="*{username}" class="btn btn-sm btn-outline-secondary"></a></dd>
                <dt class="col-sm-4 text-muted">Vrijeme</dt><dd class="col-sm-8" th:text="*{#temporals.format(loginAt,'dd.MM.yyyy HH:mm:ss')}"></dd>
            </dl>
        </div>
    </div>
</div>
</body>
</html>
