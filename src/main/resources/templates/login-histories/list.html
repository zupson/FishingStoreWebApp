<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Login povijest</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-clock-history me-2 text-primary"></i>Login povijest</h4>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>#</th><th>IP adresa</th><th>Rezultat</th><th>Korisnik</th><th>Datum/Vrijeme</th><th class="text-end">Detalji</th></tr></thead>
                <tbody>
                    <tr th:each="lh : ${loginHistories}" th:object="${lh}">
                        <td th:text="*{id}" class="text-muted small"></td>
                        <td class="font-monospace small" th:text="*{ipAddress}"></td>
                        <td>
                            <span th:if="*{success}" class="badge bg-success"><i class="bi bi-check-circle me-1"></i>Uspješno</span>
                            <span th:unless="*{success}" class="badge bg-danger"><i class="bi bi-x-circle me-1"></i>Neuspješno</span>
                        </td>
                        <td><a th:href="@{/mvc/users/{id}(id=*{userId})}" th:text="*{username}" class="text-decoration-none small"></a></td>
                        <td class="text-muted small" th:text="*{#temporals.format(loginAt,'dd.MM.yyyy HH:mm:ss')}"></td>
                        <td class="text-end"><a th:href="@{/mvc/login-histories/{id}(id=*{id})}" class="btn btn-sm btn-outline-secondary"><i class="bi bi-eye"></i></a></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(loginHistories)}"><td colspan="6" class="text-center text-muted py-4">Nema zapisa.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
