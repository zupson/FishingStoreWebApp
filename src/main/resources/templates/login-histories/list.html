<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Login povijest</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Login povijest</h4>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th>IP adresa</th>
                    <th>Korisnik</th>
                    <th>Datum/Vrijeme</th>

                </tr>
                </thead>
                <tbody>
                <tr th:each="lh : ${loginHistories}" th:object="${lh}">

                    <td class="font-monospace small" th:text="*{ipAddress}"></td>
                    <td><span th:href="@{/mvc/users/{id}(id=*{userId})}" th:text="*{username}"
                           class="text-decoration-none small"></span></td>
                    <td class="text-muted small" th:text="*{#temporals.format(loginAt,'dd.MM.yyyy HH:mm:ss')}"></td>

                </tr>
                <tr th:if="${#lists.isEmpty(loginHistories)}">
                    <td colspan="6" class="text-center text-muted py-4">Nema zapisa.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
