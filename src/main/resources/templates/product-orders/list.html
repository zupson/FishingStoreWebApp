<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layout/base}" lang="hr">
<head><title>Stavke narudžbi</title></head>
<body>
<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-box-seam me-2 text-primary"></i>Stavke narudžbi</h4>
        <a th:href="@{/mvc/product-orders/new}" class="btn btn-primary btn-sm"><i class="bi bi-plus-lg me-1"></i>Dodaj stavku</a>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>#</th><th>Količina</th><th>Cijena pri kupnji</th><th>Narudžba</th><th>Proizvod</th><th class="text-end">Akcije</th></tr></thead>
                <tbody>
                    <tr th:each="po : ${productOrders}" th:object="${po}">
                        <td th:text="*{id}" class="text-muted small"></td>
                        <td><span class="badge bg-primary rounded-pill" th:text="*{quantity}"></span></td>
                        <td class="fw-semibold" th:text="'€ ' + *{priceAtPurchase}"></td>
                        <td><a th:href="@{/mvc/orders/{id}(id=*{orderId})}" th:text="'#' + *{orderId}" class="text-decoration-none small"></a></td>
                        <td><a th:href="@{/mvc/products/{id}(id=*{productId})}" th:text="'Proizvod #' + *{productId}" class="text-decoration-none small"></a></td>
                        <td class="text-end">
                            <a th:href="@{/mvc/product-orders/edit/{id}(id=*{id})}" class="btn btn-sm btn-outline-primary me-1"><i class="bi bi-pencil"></i></a>
                            <form th:action="@{/mvc/product-orders/delete/{id}(id=*{id})}" method="post" class="d-inline" onsubmit="return confirm('Ukloniti stavku?')">
                                <button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(productOrders)}"><td colspan="6" class="text-center text-muted py-4">Nema stavki.</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
