<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Detalji stavke narudžbe</title></head>
<body>
<div layout:fragment="content" th:object="${productOrders}">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0"><i class="bi bi-bag me-2 text-primary"></i>Stavka narudžbe #<span th:text="*{id}"></span></h4>
        <a th:href="@{/mvc/product-orders}" class="btn btn-outline-secondary btn-sm"><i class="bi bi-arrow-left me-1"></i>Nazad</a>
    </div>

    <div class="row g-3" style="max-width: 800px;">
        <div class="col-md-6">
            <div class="card shadow-sm h-100">
                <div class="card-header fw-semibold bg-transparent">Informacije stavke</div>
                <div class="card-body">
                    <dl class="row mb-0">
                        <dt class="col-sm-5 text-muted">Količina</dt>
                        <dd class="col-sm-7 fw-bold" th:text="*{quantity}"></dd>
                        <dt class="col-sm-5 text-muted">Cijena pri kupnji</dt>
                        <dd class="col-sm-7 fw-bold text-success" th:text="'€ ' + *{priceAtPurchase}"></dd>
                        <dt class="col-sm-5 text-muted">Narudžba</dt>
                        <dd class="col-sm-7">
                            <a th:href="@{/mvc/orders/{id}(id=*{orderId})}" th:text="'Narudžba #' + *{orderId}" class="text-decoration-none small"></a>
                        </dd>
                        <dt class="col-sm-5 text-muted">Proizvod</dt>
                        <dd class="col-sm-7">
                            <a th:href="@{/mvc/products/{id}(id=*{productId})}" th:text="'Proizvod #' + *{productId}" class="text-decoration-none small"></a>
                        </dd>
                    </dl>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3 d-flex gap-2">
        <a sec:authorize="hasRole('ADMIN')"
           th:href="@{/mvc/product-orders/edit/{id}(id=*{id})}" class="btn btn-primary btn-sm">
            <i class="bi bi-pencil me-1"></i>Uredi
        </a>
    </div>
</div>
</body>
</html>
