<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Proizvodi</title></head>
<body>
<div layout:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Proizvodi</h4>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3">
        <div class="col" th:each="p : ${products}">
            <div class="card h-100 shadow-sm">
                <img th:src="${'/' + p.imagePath}"
                     class="card-img-top"
                     style="height: 200px; object-fit: contain;"
                     alt="Slika proizvoda"/>

                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-2">
                        <h6 class="card-title fw-bold mb-0" th:text="${p.name}"></h6>
                        <span th:if="${p.onStock}" class="badge bg-success ms-2">Na stanju</span>
                        <span th:unless="${p.onStock}" class="badge bg-secondary ms-2">Nema</span>
                    </div>
                    <p class="card-text text-muted small"
                       th:text="${p.description != null && p.description.length() > 80 ? p.description.substring(0,80) + '...' : p.description}"></p>
                    <p class="fw-bold text-success mb-0" th:text="'€ ' + ${p.price}"></p>
                </div>
                <div class="card-footer bg-transparent d-flex gap-2">
                    <a th:href="@{/mvc/products/{id}(id=${p.id}, categoryId=${categoryId})}"
                       class="btn btn-sm btn-outline-secondary flex-fill">
                        <i class="bi bi-eye me-1"></i>Detalji
                    </a>
                    <a th:href="@{/mvc/cart-products/new(productId=${p.id})}"
                       class="btn btn-sm btn-primary flex-fill">
                        <i class="bi bi-cart-plus me-1"></i>Dodaj
                    </a>
                    <div sec:authorize="hasRole('ADMIN')" class="d-flex gap-1">
                        <a th:href="@{/mvc/products/edit/{id}(id=${p.id})}"
                           class="btn btn-sm btn-outline-primary" title="Uredi">
                            <i class="bi bi-pencil"></i>
                        </a>
                        <form th:action="@{/mvc/products/delete/{id}(id=${p.id})}" method="post"
                              onsubmit="return confirm('Obrisati proizvod?')">
                            <button class="btn btn-sm btn-outline-danger" title="Obriši">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        <div class="col-12 text-center text-muted py-5" th:if="${#lists.isEmpty(products)}">
            <i class="bi bi-bag-x fs-1 d-block mb-2"></i>Nema proizvoda.
        </div>
    </div>
</div>
</body>
</html>
