<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      layout:decorate="~{layout/base}" lang="hr">
<head><title>Detalji proizvoda</title></head>
<body>
<div layout:fragment="content" th:object="${products}">

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 class="mb-0">Detalji proizvoda</h4>
        <a th:href="${categoryId != null ? '/mvc/products/categories/' + categoryId : '/mvc/categories'}"
           class="btn btn-outline-secondary btn-sm">Nazad</a>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 640px;">
        <img th:src="@{/{path}(path=*{imagePath})}"
             class="card-img-top"
             style="max-height: 300px; object-fit: contain;"
             alt="Slika proizvoda"/>
        <div class="card-body">
            <div class="d-flex justify-content-between align-items-start mb-3">
                <h5 class="fw-bold mb-0" th:text="*{name}"></h5>
                <span th:if="*{onStock}" class="badge bg-success">Na stanju</span>
                <span th:unless="*{onStock}" class="badge bg-secondary">Nije dostupno</span>
            </div>
            <p class="text-muted" th:text="*{description}"></p>
            <h4 class="text-success fw-bold" th:text="'€ ' + *{price}"></h4>
            <hr/>
            <dl class="row mb-0 small text-muted">
                <dt class="col-sm-4">Kategorija ID</dt>
                <dd class="col-sm-8">
                    <a th:href="@{/mvc/categories/{id}(id=*{categoryId})}" th:text="*{categoryId}"></a>
                </dd>
                <dt class="col-sm-4">Dodano</dt>
                <dd class="col-sm-8" th:text="*{#temporals.format(createdAt,'dd.MM.yyyy')}"></dd>
            </dl>
        </div>
        <div class="card-footer d-flex gap-2">

            <a th:href="@{/mvc/cart-products/new(productId=*{id})}"
               class="btn btn-primary">
                <i class="bi bi-cart-plus me-1"></i>Dodaj u košaricu
            </a>

            <a sec:authorize="hasRole('ADMIN')"
               th:href="@{/mvc/products/edit/{id}(id=*{id})}"
               class="btn btn-outline-primary">
                <i class="bi bi-pencil me-1"></i>Uredi
            </a>
            <form sec:authorize="hasRole('ADMIN')"
                  th:action="@{/mvc/products/delete/{id}(id=*{id})}" method="post"
                  onsubmit="return confirm('Obrisati proizvod?')">
                <button class="btn btn-outline-danger"><i class="bi bi-trash me-1"></i>Obriši</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
